<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><style>text{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#202124} .box{stroke:#454545;stroke-width:2;rx:12} .small{font-size:18px} .label{font-size:24px;font-weight:600} .arrow{stroke:#454545;stroke-width:3;fill:none;marker-end:url(#a)} .dash{stroke:#5b7c99;stroke-width:3;stroke-dasharray:9 7;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#454545"/></marker></defs><rect width="1100" height="560" fill="white"/><text x="550" y="38" text-anchor="middle" class="label">面向注意力数据流的 DaVinci 概念路径</text><rect x="45" y="85" width="180" height="75" class="box" fill="#f5dfc5"/><text x="135" y="118" text-anchor="middle" class="label">Global</text><text x="135" y="145" text-anchor="middle" class="small">权重、Q、K、V</text><rect x="280" y="85" width="190" height="75" class="box" fill="#cfe8db"/><text x="375" y="118" text-anchor="middle" class="label">MTE / NDDMA</text><text x="375" y="145" text-anchor="middle" class="small">多维搬移与布局</text><rect x="525" y="70" width="220" height="105" class="box" fill="#cbe3f3"/><text x="635" y="108" text-anchor="middle" class="label">L1 / UB</text><text x="635" y="138" text-anchor="middle" class="small">片上共享缓冲</text><text x="635" y="162" text-anchor="middle" class="small">行组与槽位</text><rect x="800" y="70" width="240" height="105" class="box" fill="#f4c7c3"/><text x="920" y="108" text-anchor="middle" class="label">Scalar</text><text x="920" y="138" text-anchor="middle" class="small">地址、循环、阶段</text><text x="920" y="162" text-anchor="middle" class="small">flag / event</text><path d="M225 122 H280" class="arrow"/><path d="M470 122 H525" class="arrow"/><path d="M745 122 H800" class="dash"/><rect x="105" y="270" width="220" height="105" class="box" fill="#f8dca8"/><text x="215" y="308" text-anchor="middle" class="label">L0A / L0B</text><text x="215" y="338" text-anchor="middle" class="small">Cube 输入 tile</text><rect x="440" y="270" width="220" height="105" class="box" fill="#f1b5a8"/><text x="550" y="308" text-anchor="middle" class="label">Cube / AIC</text><text x="550" y="338" text-anchor="middle" class="small">QK、PV、L0C 部分和</text><rect x="775" y="270" width="220" height="105" class="box" fill="#b9d8ef"/><text x="885" y="308" text-anchor="middle" class="label">Vector / AIV</text><text x="885" y="338" text-anchor="middle" class="small">Softmax、归约、激活</text><path d="M635 175 C635 220 215 220 215 270" class="arrow"/><path d="M325 322 H440" class="arrow"/><path d="M660 322 H775" class="arrow"/><path d="M775 355 C700 440 510 440 440 375" class="dash"/><text x="605" y="458" text-anchor="middle" class="small">CV 直通或 UB/L1 外层交接：QK → Softmax → PV</text><path d="M550 375 C550 425 300 425 300 480" class="arrow"/><rect x="145" y="475" width="300" height="55" class="box" fill="#eee"/><text x="295" y="510" text-anchor="middle" class="small">输出 tile / 下一层输入</text><text x="910" y="420" text-anchor="middle" class="small">虚线：控制或直接交接路径</text></svg>