[project]
name = "ai-infra-book-ru-tools"
version = "0.1.0"
description = "Перевод и проверки русского community-издания AI Infra in Depth"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyYAML>=6.0.2,<7",
    "cairosvg>=2.8,<3",
    "jsonschema>=4.25,<5",
    "pillow>=11,<13",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ruff.lint.extend-per-file-ignores]
"book/gen_*_figs.py" = ["E501"] # Длинные строки являются видимыми подписями SVG.

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = [
    "scripts",
    "tests",
    "book/gen_*_figs.py",
    "book/gen_cover.py",
    "book/svg_lib.py",
]
